<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ARPG</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      body { font: 14px system-ui, sans-serif; color: #f2eadb; }
      #help, #toast { position: fixed; padding: 10px 16px; background: #172822e6; border-radius: 6px; }
      #help { left: 16px; bottom: 16px; pointer-events: none; }
      #toast { left: 50%; top: 20px; transform: translateX(-50%); }
      #graphics-stopped { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; background: #15221ee8; }
      button { font: inherit; padding: 10px 24px; cursor: pointer; }
    </style>
  </head>
  <body>
    <canvas id="stage" tabindex="0" aria-label="Game view"></canvas>
    <div id="help">WASD move · Mouse aim · Space dodge · 1–4 skills · E interact · F8 copy replay</div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
